<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Creating an agent with one signature, through Strike&#x27;s builder connect">
<title>Creating an agent with one signature, through Strike&#x27;s builder connect</title>
<defs><marker id="h-mint" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#4efab0"/></marker><marker id="s-mint" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#4efab0"/></marker><marker id="h-faint" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#7e8883"/></marker><marker id="s-faint" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#7e8883"/></marker><marker id="h-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f8931a"/></marker><marker id="s-gold" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#f8931a"/></marker><marker id="h-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f472b6"/></marker><marker id="s-rose" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#f472b6"/></marker><marker id="h-sky" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#60a5fa"/></marker><marker id="s-sky" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#60a5fa"/></marker></defs>
<rect width="900" height="640" rx="16" fill="#0b0d0c"/>
<g data-group="1">
<rect x="18" y="20" width="184" height="48" rx="8" fill="#121614" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="110.0" y="41" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e8ecea" text-anchor="middle">You</text>
<text x="110.0" y="58" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7" text-anchor="middle">a Cardano wallet</text>
</g>
<path d="M110,68 V620" stroke="#2a3530" stroke-width="1.2" stroke-dasharray="3 4"/>
<g data-group="1">
<rect x="244" y="20" width="184" height="48" rx="8" fill="#121614" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="336.0" y="41" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e8ecea" text-anchor="middle">The site</text>
<text x="336.0" y="58" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7" text-anchor="middle">browser + Functions</text>
</g>
<path d="M336,68 V620" stroke="#2a3530" stroke-width="1.2" stroke-dasharray="3 4"/>
<g data-group="1">
<rect x="470" y="20" width="184" height="48" rx="8" fill="#121614" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="562.0" y="41" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#4efab0" text-anchor="middle">Agents&#x27; host</text>
<text x="562.0" y="58" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7" text-anchor="middle">the fleet</text>
</g>
<path d="M562,68 V620" stroke="#2a3530" stroke-width="1.2" stroke-dasharray="3 4"/>
<g data-group="1">
<rect x="696" y="20" width="184" height="48" rx="8" fill="#121614" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="788.0" y="41" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#4efab0" text-anchor="middle">Strike</text>
<text x="788.0" y="58" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7" text-anchor="middle">builder connect, API v2</text>
</g>
<path d="M788,68 V620" stroke="#2a3530" stroke-width="1.2" stroke-dasharray="3 4"/>
<path d="M556,112 H340" fill="none" stroke="#7e8883" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#h-faint)"/>
<circle cx="352" cy="98" r="9" fill="#0b0d0c" stroke="#7e8883" stroke-width="1.3"/>
<text x="352" y="101.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#7e8883" text-anchor="middle">1</text>
<text x="366" y="105" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">keeps fresh API-wallet keys on offer</text>
<text x="366" y="127" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">public keys only: private keys stay encrypted on the host</text>
<path d="M116,172 H332" fill="none" stroke="#4efab0" stroke-width="1.4" marker-end="url(#h-mint)"/>
<circle cx="126" cy="158" r="9" fill="#0b0d0c" stroke="#4efab0" stroke-width="1.3"/>
<text x="126" y="161.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#4efab0" text-anchor="middle">2</text>
<text x="140" y="165" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">build the agent, then review it</text>
<text x="140" y="187" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">character, personality, strategy,</text>
<text x="140" y="201" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">markets, risk, the 0.20 % fee</text>
<path d="M342,240 H784" fill="none" stroke="#4efab0" stroke-width="1.4" marker-end="url(#h-mint)"/>
<circle cx="352" cy="226" r="9" fill="#0b0d0c" stroke="#4efab0" stroke-width="1.3"/>
<text x="352" y="229.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#4efab0" text-anchor="middle">3</text>
<text x="366" y="233" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">POST /auth/builder/request-signature</text>
<text x="366" y="255" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">your address, chain cardano, our code, fee_share_bps 20</text>
<path d="M782,296 H340" fill="none" stroke="#7e8883" stroke-width="1.4" marker-end="url(#h-faint)"/>
<circle cx="352" cy="282" r="9" fill="#0b0d0c" stroke="#7e8883" stroke-width="1.3"/>
<text x="352" y="285.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#7e8883" text-anchor="middle">4</text>
<text x="366" y="289" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the exact message to sign</text>
<path d="M330,346 H114" fill="none" stroke="#4efab0" stroke-width="1.4" marker-end="url(#h-mint)"/>
<circle cx="126" cy="332" r="9" fill="#0b0d0c" stroke="#4efab0" stroke-width="1.3"/>
<text x="126" y="335.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#4efab0" text-anchor="middle">5</text>
<text x="140" y="339" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">one signature (CIP-30 signData)</text>
<text x="140" y="361" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">in your own wallet</text>
<path d="M342,404 H784" fill="none" stroke="#4efab0" stroke-width="1.4" marker-end="url(#h-mint)"/>
<circle cx="352" cy="390" r="9" fill="#0b0d0c" stroke="#4efab0" stroke-width="1.3"/>
<text x="352" y="393.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#4efab0" text-anchor="middle">6</text>
<text x="366" y="397" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">POST /auth/builder/verify-signature</text>
<text x="366" y="419" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Strike authorises the API wallet on your account</text>
<g data-group="1">
<rect x="244" y="444" width="300" height="91" rx="8" fill="#101a15" stroke="#4efab0" stroke-width="1" data-box="1"/>
<text x="256" y="463" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4efab0">The site checks before saving</text>
<text x="256" y="480" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">Strike linked exactly our key, our builder code</text>
<text x="256" y="495" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">and 20 bps? Otherwise the key is burnt.</text>
<text x="256" y="510" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">Saved with an audit row: the exact message</text>
<text x="256" y="525" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">and your signature.</text>
</g>
<path d="M556,574 H340" fill="none" stroke="#7e8883" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#h-faint)"/>
<circle cx="352" cy="560" r="9" fill="#0b0d0c" stroke="#7e8883" stroke-width="1.3"/>
<text x="352" y="563.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#7e8883" text-anchor="middle">7</text>
<text x="366" y="567" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the fleet reads the new link</text>
<text x="366" y="589" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">HMAC-signed, outbound</text>
<path d="M568,604 H784" fill="none" stroke="#4efab0" stroke-width="1.4" marker-end="url(#h-mint)"/>
<circle cx="578" cy="590" r="9" fill="#0b0d0c" stroke="#4efab0" stroke-width="1.3"/>
<text x="578" y="593.6" font-family="'Plex Mono','IBM Plex Mono',Consolas,Menlo,monospace" font-size="10" font-weight="600" fill="#4efab0" text-anchor="middle">8</text>
<text x="592" y="597" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#fff" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">your agent trades your account</text>
<text x="592" y="619" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883" stroke="#0b0d0c" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ed25519 · builder fee on every order</text>
</svg>
