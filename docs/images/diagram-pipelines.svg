<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" role="img" aria-label="Two measured pipelines: the News Tower&#x27;s reading and the Strike City score">
<title>Two measured pipelines: the News Tower&#x27;s reading and the Strike City score</title>
<defs><marker id="h-mint" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#4efab0"/></marker><marker id="s-mint" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#4efab0"/></marker><marker id="h-faint" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#7e8883"/></marker><marker id="s-faint" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#7e8883"/></marker><marker id="h-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f8931a"/></marker><marker id="s-gold" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#f8931a"/></marker><marker id="h-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#f472b6"/></marker><marker id="s-rose" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#f472b6"/></marker><marker id="h-sky" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#60a5fa"/></marker><marker id="s-sky" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 z" fill="#60a5fa"/></marker></defs>
<rect width="900" height="352" rx="16" fill="#0b0d0c"/>
<rect x="20" y="20" width="860" height="140" rx="12" fill="#121614" stroke="#2a3530" stroke-width="1"/>
<text x="38" y="50" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#60a5fa">The News Tower: news, measured on Strike</text>
<g data-group="1">
<rect x="38" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="50" y="89" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Tiered sources</text>
<text x="50" y="106" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">official, tier-one,</text>
<text x="50" y="121" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">filtered searches</text>
</g>
<path d="M162,105 H176" fill="none" stroke="#60a5fa" stroke-width="1.3" marker-end="url(#h-sky)"/>
<g data-group="1">
<rect x="178" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="190" y="89" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Model scoring</text>
<text x="190" y="106" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">fixed scale,</text>
<text x="190" y="121" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">catalysts only</text>
</g>
<path d="M302,105 H316" fill="none" stroke="#60a5fa" stroke-width="1.3" marker-end="url(#h-sky)"/>
<g data-group="1">
<rect x="318" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="330" y="89" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">One vote a story</text>
<text x="330" y="106" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">however many</text>
<text x="330" y="121" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">outlets carry it</text>
</g>
<path d="M442,105 H456" fill="none" stroke="#60a5fa" stroke-width="1.3" marker-end="url(#h-sky)"/>
<g data-group="1">
<rect x="458" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
