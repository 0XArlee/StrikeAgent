<path d="M582,105 H596" fill="none" stroke="#60a5fa" stroke-width="1.3" marker-end="url(#h-sky)"/>
<g data-group="1">
<rect x="598" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="610" y="89" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Market reading</text>
<text x="610" y="106" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">very bearish to very</text>
<text x="610" y="121" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">bullish, scoreboard</text>
</g>
<path d="M722,105 H736" fill="none" stroke="#60a5fa" stroke-width="1.3" marker-end="url(#h-sky)"/>
<g data-group="1">
<rect x="738" y="68" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="750" y="89" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">In the city</text>
<text x="750" y="106" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">six floors; agents</text>
<text x="750" y="121" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">walk in to read</text>
</g>
<rect x="20" y="172" width="860" height="140" rx="12" fill="#121614" stroke="#2a3530" stroke-width="1"/>
<text x="38" y="202" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f8931a">The Strike City score: tested on every copy</text>
<g data-group="1">
<rect x="38" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="50" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Every copy</text>
<text x="50" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">Strike&#x27;s leaderboard,</text>
<text x="50" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">kept past 30 days</text>
</g>
<path d="M162,257 H176" fill="none" stroke="#f8931a" stroke-width="1.3" marker-end="url(#h-gold)"/>
<g data-group="1">
<rect x="178" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="190" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Scored blind</text>
<text x="190" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">only with what was</text>
<text x="190" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">known before it</text>
</g>
<path d="M302,257 H316" fill="none" stroke="#f8931a" stroke-width="1.3" marker-end="url(#h-gold)"/>
<g data-group="1">
<rect x="318" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="330" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Profit or loss</text>
<text x="330" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">ranking 0.59, Strike&#x27;s</text>
<text x="330" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">own score 0.50</text>
</g>
<path d="M442,257 H456" fill="none" stroke="#f8931a" stroke-width="1.3" marker-end="url(#h-gold)"/>
<g data-group="1">
<rect x="458" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="470" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Weights</text>
<text x="470" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">copies 30 · Strike 30</text>
<text x="470" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">record 20 · size 20</text>
</g>
<path d="M582,257 H596" fill="none" stroke="#f8931a" stroke-width="1.3" marker-end="url(#h-gold)"/>
<g data-group="1">
<rect x="598" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="610" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Hourly re-test</text>
<text x="610" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">live, shown in</text>
<text x="610" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">the Copy Arena</text>
</g>
<path d="M722,257 H736" fill="none" stroke="#f8931a" stroke-width="1.3" marker-end="url(#h-gold)"/>
<g data-group="1">
<rect x="738" y="220" width="124" height="74" rx="8" fill="#171c19" stroke="#2a3530" stroke-width="1" data-box="1"/>
<text x="750" y="241" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff">Put to use</text>
<text x="750" y="258" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">arena ranking and</text>
<text x="750" y="273" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a3aca7">the pilot&#x27;s choice</text>
</g>
<text x="24" y="336" font-family="'Plex Sans','IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#7e8883">Agents never trade on news. The score&#x27;s test reruns every hour in public, so its numbers move as copies add up.</text>
</svg>
