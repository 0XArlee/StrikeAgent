# Paper trading (no real orders): reference parameters on 2h candles (E6: +0.33 R/op, t 2.6, about twice the trades of 4h).
name = "paper-2h"
mode = "simulation"
env = "mainnet"
tf = "120"
markets = [
  { strike = "BTC-USD", signal = "BTCUSDT" }, { strike = "ETH-USD", signal = "ETHUSDT" },
  { strike = "SOL-USD", signal = "SOLUSDT" }, { strike = "XRP-USD", signal = "XRPUSDT" },
  { strike = "BNB-USD", signal = "BNBUSDT" }, { strike = "ADA-USD", signal = "ADAUSDT" },
  { strike = "NEAR-USD", signal = "NEARUSDT" }, { strike = "ZEC-USD", signal = "ZECUSDT" },
]
builder_fee_bps = 20   # the Smart Flow fee (Edgar, 2026-10-19)
paper_equity = 10000.0

[params]
# reference parameters

[risk]
risk_per_trade = 0.005
max_open_positions = 8
