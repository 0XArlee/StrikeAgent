# Strike City (/api/city): agents shown in the city. Only `public = true` agents are exposed, read-only:
# decisions, positions and closed trades from runs/<name>/journal.jsonl and state.json. No keys, no order ids.
[info]
env = "mainnet"
builder_code = ""      # empty until the Smart Flow builder is registered on app.strikefinance.org/builder-codes
fee_bps = 20           # per execution (20 bps = 0.20 %), Edgar 2026-10-19
taker_fee_bps = 5
markets = ["BTC-USD", "ETH-USD", "SOL-USD", "XRP-USD", "BNB-USD", "ADA-USD", "NEAR-USD", "ZEC-USD"]

[[agent]]
id = "sf-reference"
name = "Smart Flow · Official"
config = "config/paper-reference.toml"
public = true
look = { skin = "#e2ad85", hair = "short", hairColor = "#1c1917", top = "suit", topColor = "#171717", top2 = "#e5e7eb", accent = "#4efab0", pants = "#171717", face = "visor", faceColor = "#4efab0" }   # Smart Flow uniform

[[agent]]
id = "sf-pyramid"
name = "Smart Flow · Pyramid"
config = "config/paper-pyramid.toml"
