# Paper trading (no real orders): Binance spot signal feed, fills simulated on Strike MAINNET public order book.
name = "paper-reference"
mode = "simulation"
env = "mainnet"
tf = "240"
markets = [
  { strike = "BTC-USD", signal = "BTCUSDT" }, { strike = "ETH-USD", signal = "ETHUSDT" },
  { strike = "SOL-USD", signal = "SOLUSDT" }, { strike = "XRP-USD", signal = "XRPUSDT" },
  { strike = "BNB-USD", signal = "BNBUSDT" }, { strike = "ADA-USD", signal = "ADAUSDT" },
  { strike = "NEAR-USD", signal = "NEARUSDT" }, { strike = "ZEC-USD", signal = "ZECUSDT" },
]
builder_fee_bps = 20   # the Smart Flow fee (Edgar, 2026-10-19)
paper_equity = 10000.0

strategy = "smartflow"   # config/strategies.json: this is its official paper agent
[params]
# the official Smart Flow configuration (core.config.OFFICIAL, docs/10)
range_filter = true
chand_atr = 4.0

[risk]
risk_per_trade = 0.01      # the default preset of users (standard, 1 %; live/fleet.py RISK)
max_open_positions = 8
